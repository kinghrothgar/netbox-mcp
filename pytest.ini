[pytest]
# pytest-asyncio: every `async def test_*` is an asyncio test, no
# explicit @pytest.mark.asyncio needed.
asyncio_mode = auto

# Function-scoped event loops (the pytest-asyncio default). The
# mcp_client fixture is function-scoped so each test gets a fresh
# loop, fresh client, fresh MCP session - no cross-loop state to
# deadlock on. The netbox_mcp_url fixture is session-scoped but only
# returns a string, so loop-scope mismatch doesn't matter for it.
asyncio_default_fixture_loop_scope = function

# Per-test timeout via pytest-timeout. Surfaces hangs quickly instead
# of letting the session lock up indefinitely.
timeout = 30
timeout_method = thread

